<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Lost in the Void</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #03010a;
      --grid: rgba(255,255,255,0.03);
      --accent: #00ffe7;
      --accent2: #ff2d78;
      --text: #e8e0ff;
      --muted: #6b5f8a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      overflow: hidden;
    }

    /* Starfield */
    canvas#stars {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* Grid overlay */
    .grid {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
    }

    /* Glow orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 1;
      opacity: 0.18;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .orb-1 { width: 500px; height: 500px; background: var(--accent); top: -100px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; background: var(--accent2); bottom: -80px; right: -80px; animation-delay: -7s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.1); }
    }

    /* Main content */
    .container {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      text-align: center;
      padding: 2rem;
    }

    /* Glitch 404 */
    .big-404 {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(100px, 22vw, 220px);
      font-weight: 900;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 2px var(--accent);
      position: relative;
      letter-spacing: -4px;
      animation: flicker 5s infinite;
    }

    .big-404::before,
    .big-404::after {
      content: '404';
      position: absolute;
      inset: 0;
      font-family: 'Unbounded', sans-serif;
      font-weight: 900;
    }
    .big-404::before {
      color: var(--accent2);
      -webkit-text-stroke: 0;
      clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
      transform: translateX(-4px);
      opacity: 0.7;
      animation: glitch1 3s infinite;
    }
    .big-404::after {
      color: var(--accent);
      -webkit-text-stroke: 0;
      clip-path: polygon(0 60%, 100% 60%, 100% 75%, 0 75%);
      transform: translateX(4px);
      opacity: 0.7;
      animation: glitch2 3s infinite;
    }

    @keyframes glitch1 {
      0%, 90%, 100% { transform: translateX(-4px); opacity: 0.7; }
      92% { transform: translateX(8px) scaleY(1.02); opacity: 1; }
      94% { transform: translateX(-8px); opacity: 0.5; }
      96% { transform: translateX(4px); opacity: 0.9; }
    }
    @keyframes glitch2 {
      0%, 85%, 100% { transform: translateX(4px); opacity: 0.7; }
      87% { transform: translateX(-10px) scaleY(0.98); opacity: 1; }
      89% { transform: translateX(6px); opacity: 0.4; }
      91% { transform: translateX(-4px); opacity: 0.8; }
    }
    @keyframes flicker {
      0%, 97%, 100% { opacity: 1; }
      98% { opacity: 0.85; }
      99% { opacity: 1; }
    }

    .tagline {
      font-size: clamp(0.75rem, 2vw, 1rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: 0.5rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.3s forwards;
    }

    .divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 1.5rem auto;
      opacity: 0;
      animation: fadeUp 0.8s 0.5s forwards;
    }

    .message {
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      color: var(--muted);
      max-width: 420px;
      line-height: 1.8;
      opacity: 0;
      animation: fadeUp 0.8s 0.7s forwards;
    }

    .hidden-note {
      font-size: 0.65rem;
      color: rgba(107, 95, 138, 0.4);
      margin-top: 0.5rem;
      letter-spacing: 0.15em;
      opacity: 0;
      animation: fadeUp 0.8s 0.9s forwards;
    }

    .btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      text-decoration: none;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      transition: color 0.3s;
      opacity: 0;
      animation: fadeUp 0.8s 1.1s forwards;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent);
      transform: translateX(-101%);
      transition: transform 0.3s ease;
      z-index: -1;
    }
    .btn:hover { color: var(--bg); }
    .btn:hover::before { transform: translateX(0); }

    /* Terminal blink cursor */
    .cursor {
      display: inline-block;
      width: 10px;
      height: 1.1em;
      background: var(--accent);
      vertical-align: middle;
      margin-left: 4px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
    }
  </style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="scanlines"></div>

<div class="container">
  <div class="big-404">404</div>
  <div class="tagline">Signal Lost<span class="cursor"></span></div>
  <div class="divider"></div>
  <p class="message">You've drifted beyond the known universe.<br>This page has collapsed into a black hole.</p>
  <p class="hidden-note">Ceci n'est pas une page</p>
  <a href="/" class="btn">Return to Origin</a>
</div>

<script>
  // Starfield
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function initStars(n = 180) {
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.2,
      o: Math.random() * 0.7 + 0.1,
      s: Math.random() * 0.3 + 0.05,
      d: Math.random() > 0.5 ? 1 : -1
    }));
  }

  function drawStars() {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220,210,255,${s.o})`;
      ctx.fill();
      s.o += s.s * 0.01 * s.d;
      if (s.o > 0.9 || s.o < 0.05) s.d *= -1;
    }
    requestAnimationFrame(drawStars);
  }

  resize();
  initStars();
  drawStars();
  window.addEventListener('resize', () => { resize(); initStars(); });
</script>
</body>
</html>
